<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer Dashboard - Live RTSP Stream</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-live {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stream-container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .overlay-message {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .source-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent);
      color: #0f172a;
    }

    button.primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>📹</span> Printer Dashboard
    </h1>
    <div id="statusBadge" class="badge badge-live">
      <span class="badge-dot"></span>
      <span id="statusText">LIVE</span>
    </div>
  </header>

  <main class="stream-container">
    <div class="canvas-wrapper" id="playerWrapper">
      <canvas id="videoCanvas"></canvas>
      <div class="overlay-message" id="overlay">
        <p>Connecting to stream...</p>
      </div>
    </div>

    <div class="controls-bar">
      <div class="source-info">
        <span>RTSP: <strong>rtsp://192.168.0.121/live</strong></span>
      </div>
      <div class="actions">
        <button id="snapshotBtn" title="Download snapshot">📸 Snapshot</button>
        <button id="reconnectBtn" title="Reconnect stream">🔄 Reconnect</button>
        <button id="fullscreenBtn" class="primary" title="Full screen">⛶ Fullscreen</button>
      </div>
    </div>
  </main>

  <script src="jsmpeg.min.js"></script>
  <script>
    const canvas = document.getElementById('videoCanvas');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('statusText');
    const statusBadge = document.getElementById('statusBadge');
    const snapshotBtn = document.getElementById('snapshotBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const playerWrapper = document.getElementById('playerWrapper');

    let player = null;

    function getStreamUrl() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocol}//${location.host}/api/stream`;
    }

    function initPlayer() {
      if (player) {
        player.destroy();
        player = null;
      }

      overlay.style.display = 'flex';
      overlay.innerHTML = '<p>Connecting to stream...</p>';
      statusText.textContent = 'CONNECTING';

      const url = getStreamUrl();

      player = new JSMpeg.Player(url, {
        canvas: canvas,
        autoplay: true,
        audio: false,
        onVideoDecode: () => {
          if (overlay.style.display !== 'none') {
            overlay.style.display = 'none';
            statusText.textContent = 'LIVE';
          }
        },
        onSourceEstablished: () => {
          statusText.textContent = 'BUFFERING';
        },
        onSourceCompleted: () => {
          statusText.textContent = 'DISCONNECTED';
          overlay.style.display = 'flex';
          overlay.innerHTML = '<p>Stream ended. <button onclick="initPlayer()">Retry</button></p>';
        }
      });
    }

    snapshotBtn.addEventListener('click', () => {
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = `webcam-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    reconnectBtn.addEventListener('click', () => {
      initPlayer();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        playerWrapper.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Start player on load
    window.addEventListener('load', initPlayer);
  </script>
</body>
</html>
